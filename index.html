<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="maincontainer">
       <h1>PixelVault</h1>
       </div>
    <section class="searchcontainer">
        <div class="search">
           <button id="lens"> <i class="fa-solid fa-magnifying-glass" ></i></button>
            <input type="text" placeholder="Search images........." id="searchbar" title="SearchBar">
        </div>
    </section>
</header>

    <section class="categories" id="btns">
          <div id="logocontainer" >
       <img src="logo.png" alt="PixelVault Logo" id="logo">
       </div>
        <button  id="b1" title="IndianBuildings"><i class="fa-solid fa-house"></i></button>
        <button id="b2" title="Nature"><i class="fa-solid fa-tree" ></i></button>
        <button id="b3" title="Food"><i class="fa-solid fa-utensils" ></i></button>
        <button id="b4" title="Animals"><i class="fa-solid fa-paw" ></i></button>
        <button id="b5" title="Dresses"><i class="fa-solid fa-shirt" ></i></button>
        <button id="b6" title="Downloads"><i class="fa-solid fa-store"></i></button>
        <button id="b7" title="Liked"><i class="fa-solid fa-heart"></i></button>
    </section>


<main class="content">
    <div id="loader" class="loader"></div>
    <section class="gallery">

        <div class="card">
            <img src="https://picsum.photos/400/600" alt="">
    
            <button class="likebtn" >
                <i class="fa-solid fa-heart"></i>
            </button>
            <button class="downloadbtn">
               <i class="fa-solid fa-download"></i>
            </button>

        </div>

        <div class="card">
            <img src="https://picsum.photos/400/500" alt="">

            <button class="likebtn">
                <i class="fa-solid fa-heart"></i>
            </button>
            <button class="downloadbtn">
               <i class="fa-solid fa-download"></i>
            </button>

        </div>

        <div class="card">
            <img src="https://picsum.photos/400/700" alt="">

            <button class="likebtn">
                <i class="fa-solid fa-heart"></i>
            </button>
            <button class="downloadbtn">
               <i class="fa-solid fa-download"></i>
            </button>

        </div>

        <div class="card">
            <img src="https://picsum.photos/400/450" alt="">

            <button class="likebtn">
                <i class="fa-solid fa-heart"></i>
            </button>
            <button class="downloadbtn">
               <i class="fa-solid fa-download"></i>
            </button>

        </div>

        <div class="card">
            <img src="https://picsum.photos/400/650" alt="">

            <button class="likebtn">
                <i class="fa-solid fa-heart"></i>
            </button>
            <button class="downloadbtn">
               <i class="fa-solid fa-download"></i>
            </button>

        </div>

        <div class="card">
            <img src="https://picsum.photos/400/550" alt="">
            <button class="likebtn">
                <i class="fa-solid fa-heart"></i>
            </button>
            <button class="downloadbtn">
               <i class="fa-solid fa-download"></i>
            </button>
            
        </div>

    </section>
    </main>
   <script src="script.js"></script>
</body>
</html>
